name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "_pages/**"
      - "_projects/**"
      - "_includes/**"
      - "_layouts/**"
      - "assets/**"
      - "_config.yml"
      - ".github/workflows/broken-links.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "_pages/**"
      - "_projects/**"
      - "_includes/**"
      - "_layouts/**"
      - "assets/**"
      - "_config.yml"
      - ".github/workflows/broken-links.yml"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # LinkedIn rejects automated checks; the built-site job validates local navigation.
          args: --exclude 'https://(www\.)?linkedin\.com/.*' --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _pages/dropdown.md --exclude-path _pages/news.md --exclude-path _pages/profiles.md --exclude-path _pages/publications.md --exclude-path _pages/repositories.md --exclude-path _pages/teaching.md --verbose --no-progress './_pages/*.md' './_projects/*.md'
